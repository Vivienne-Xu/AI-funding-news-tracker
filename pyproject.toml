[project]
name = "ai-funding-agent"
version = "0.1.0"
description = "Daily AI startup funding brief and monthly report"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "pyyaml>=6",
    "httpx>=0.27",
    "feedparser>=6",
    "rapidfuzz>=3",
    "trafilatura>=2",
    "google-genai>=1.0",
    "jinja2>=3.1.6",
    "premailer>=3.10.0",
    "playwright>=1.63.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
app = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
